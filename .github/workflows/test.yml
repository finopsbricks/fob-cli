name: Test

# Unit + end-to-end tests on every OS the dispatcher ships for. Windows matters:
# PATH/PATHEXT resolution, .cmd shim escaping and the PowerShell completer only
# run for real there (tests/spawn.test.js, tests/completion.test.js).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
