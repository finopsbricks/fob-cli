name: Release

# Tag-driven. Bun cross-compiles every target from one runner; artifacts are
# published to Cloudflare R2 (served at https://get.finopsbricks.com), so the
# source repo stays private while the compiled binaries are anonymously
# downloadable. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with "Workers R2 Storage: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — 9df1ca9e13144855866a6cdc3dd374e4
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & publish to R2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build all targets
        run: bun run build

      - name: Publish to R2 (latest at root + versioned under the tag)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          npm i -g wrangler
          ct() { case "$1" in
            SHA256SUMS) echo text/plain ;;
            install.sh) echo text/x-shellscript ;;
            *)          echo application/octet-stream ;;
          esac; }
          publish() { # publish <localpath> <key>
            wrangler r2 object put "fob-cli/$2" --file "$1" \
              --content-type "$(ct "$(basename "$1")")" --remote
          }
          for f in dist/fob-* dist/SHA256SUMS; do
            name="$(basename "$f")"
            publish "$f" "$name"          # latest, at bucket root
            publish "$f" "$TAG/$name"     # pinned, under the version prefix
          done
          publish install.sh install.sh
